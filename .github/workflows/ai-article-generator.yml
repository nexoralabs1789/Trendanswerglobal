name: TrendAnswer - AI Article Generator (Evidence First)

on:
  workflow_dispatch:
  schedule:
    - cron: '31 8 * * 1,4'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trendanswer-editorial
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate evidence-based draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python - <<'PY'
          import datetime as dt
          import email.utils
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          FEEDS = {
              'Google AI Blog': 'https://blog.google/innovation-and-ai/technology/ai/rss/',
              'AWS Machine Learning Blog': 'https://aws.amazon.com/blogs/machine-learning/feed/',
              'Microsoft Official Blog': 'https://blogs.microsoft.com/feed/',
          }

          BLOCKED = (
              'lawsuit',
              'sues',
              'suing',
              'election',
              'death',
              'war',
              'medical',
              'health',
              'bankruptcy',
              'crime'
          )

          now = dt.datetime.now(dt.timezone.utc)
          seen = set()
          candidates = []

          # STEP 1: Collect official technology news

          for publisher, feed in FEEDS.items():
              try:
                  req = urllib.request.Request(
                      feed,
                      headers={
                          'User-Agent': 'TrendAnswer-Research/1.0'
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=25
                  ) as response:
                      root = ET.fromstring(
                          response.read(3_000_000)
                      )

                  for item in root.findall('.//channel/item')[:15]:

                      title = (
                          item.findtext('title') or ''
                      ).strip()

                      link = (
                          item.findtext('link') or ''
                      ).strip()

                      stamp = (
                          item.findtext('pubDate') or ''
                      ).strip()

                      description = (
                          item.findtext('description') or ''
                      )

                      description = re.sub(
                          r'<[^>]+>',
                          ' ',
                          description
                      )

                      description = html.unescape(
                          description
                      )

                      description = ' '.join(
                          description.split()
                      )[:1800]

                      try:
                          published = (
                              email.utils
                              .parsedate_to_datetime(stamp)
                              .astimezone(dt.timezone.utc)
                          )

                      except (
                          ValueError,
                          TypeError,
                          IndexError
                      ):
                          continue

                      host = (
                          urllib.parse.urlparse(link)
                          .hostname or ''
                      )

                      allowed = {
                          'Google AI Blog': (
                              'blog.google',
                              'www.blog.google'
                          ),
                          'AWS Machine Learning Blog': (
                              'aws.amazon.com',
                          ),
                          'Microsoft Official Blog': (
                              'blogs.microsoft.com',
                          ),
                      }[publisher]

                      if (
                          host not in allowed
                          or not link.startswith('https://')
                      ):
                          continue

                      if (
                          not title
                          or (now - published).days > 10
                          or published > now
                      ):
                          continue

                      if any(
                          term in title.lower()
                          for term in BLOCKED
                      ):
                          continue

                      if link in seen:
                          continue

                      seen.add(link)

                      candidates.append({
                          'publisher': publisher,
                          'title': title,
                          'url': link,
                          'published_utc': (
                              published.date().isoformat()
                          ),
                          'source_excerpt': description
                      })

              except Exception as exc:
                  print(
                      f'RSS source skipped ({publisher}): '
                      f'{type(exc).__name__}'
                  )

          if not candidates:
              print(
                  'No eligible current primary-source items. '
                  'No draft created.'
              )
              raise SystemExit(0)

          # STEP 2: Select one primary source

          candidates.sort(
              key=lambda x: (
                  x['published_utc'],
                  bool(x['source_excerpt'])
              ),
              reverse=True
          )

          source = next(
              (
                  x for x in candidates
                  if len(x['source_excerpt']) >= 120
              ),
              None
          )

          if source is None:
              print(
                  'No item has enough source context. '
                  'No draft created.'
              )
              raise SystemExit(0)

          # STEP 3: Connect to Gemini

          key = os.environ.get(
              'GEMINI_API_KEY',
              ''
          )

          if not key:
              raise RuntimeError(
                  'Missing GEMINI_API_KEY repository secret.'
              )

          endpoint = (
              'https://generativelanguage.googleapis.com/'
              'v1beta/'
          )

          req = urllib.request.Request(
              endpoint + 'models',
              headers={
                  'x-goog-api-key': key
              }
          )

          with urllib.request.urlopen(
              req,
              timeout=30
          ) as response:
              models = json.load(
                  response
              ).get('models', [])

          available = {
              m['name']
              for m in models
              if 'generateContent' in
              m.get('supportedGenerationMethods', [])
          }

          preferred = (
              'models/gemini-3.5-flash-lite',
              'models/gemini-2.5-flash-lite'
          )

          model = next(
              (
                  name
                  for name in preferred
                  if name in available
              ),
              None
          )

          if not model:
              raise RuntimeError(
                  'No approved Flash-Lite model is available; '
                  'stopped rather than selecting '
                  'a potentially paid model.'
              )

          # STEP 4: Prepare evidence-first instructions

          prompt = '''
          You are drafting an editorial research brief
          for an English-language technology site.

          You have exactly ONE official publisher feed item,
          which is NOT an independently verified full article.

          Never assert that a claim is independently verified.

          Do not include facts not explicit in the
          provided title or excerpt.

          Do not invent quotes, metrics, dates, examples,
          named entities, features, legal claims,
          or outside sources.

          Do not cite any URL other than the one provided.

          Do not pretend to have opened the full page.

          Write useful evergreen context ONLY if it can
          be stated without unsourced concrete claims;
          mark uncertainty.

          If the evidence is too thin for a defensible
          article, return verdict NO_PUBLISH
          and an explanation.

          Respond with exactly the fields below
          in plain text, one per line;
          use no markdown code fences:

          VERDICT: READY_FOR_HUMAN_REVIEW or NO_PUBLISH

          SEO_TITLE: under 60 characters

          META_DESCRIPTION: under 155 characters

          QUESTION: one natural reader question

          KEYWORD: one natural search phrase

          SOURCE_URL: exactly the supplied URL

          EVIDENCE_LIMITATIONS: one or more sentences

          ARTICLE_DRAFT:

          a coherent 350-650 word evidence-bounded
          Markdown article with practical context
          and a section titled What remains unverified.

          Do not make up material to reach a word count.

          The article is a draft,
          never a verified news report.

          SOURCE_ITEM_JSON:
          ''' + json.dumps(
              source,
              ensure_ascii=False
          )

          # STEP 5: Generate AI article draft

          payload = {
              'contents': [
                  {
                      'parts': [
                          {'text': prompt}
                      ]
                  }
              ],
              'generationConfig': {
                  'temperature': 0.1,
                  'maxOutputTokens': 2600
              }
          }

          api_req = urllib.request.Request(
              endpoint + model + ':generateContent',
              data=json.dumps(payload).encode(),
              headers={
                  'Content-Type': 'application/json',
                  'x-goog-api-key': key
              },
              method='POST'
          )

          with urllib.request.urlopen(
              api_req,
              timeout=110
          ) as response:
              output = json.load(response)

          parts = (
              output.get('candidates', [{}])[0]
              .get('content', {})
              .get('parts', [])
          )

          draft = '\n'.join(
              p.get('text', '')
              for p in parts
          )

          # STEP 6: Check AI output

          checks = (
              'VERDICT:',
              'SEO_TITLE:',
              'META_DESCRIPTION:',
              'QUESTION:',
              'KEYWORD:',
              'SOURCE_URL:',
              'EVIDENCE_LIMITATIONS:',
              'ARTICLE_DRAFT:'
          )

          if not all(
              marker in draft
              for marker in checks
          ):
              raise RuntimeError(
                  'Incomplete AI output. Nothing saved.'
              )

          if source['url'] not in draft:
              raise RuntimeError(
                  'Primary source missing from output. '
                  'Nothing saved.'
              )

          if 'VERDICT: NO_PUBLISH' in draft:
              print(
                  'AI reported insufficient evidence. '
                  'No draft PR created.'
              )
              raise SystemExit(0)

          if (
              'VERDICT: READY_FOR_HUMAN_REVIEW'
              not in draft
          ):
              raise RuntimeError(
                  'Unexpected verdict. Nothing saved.'
              )

          # STEP 7: Save draft for human review

          folder = Path('.github/drafts')

          folder.mkdir(
              parents=True,
              exist_ok=True
          )

          slug = re.sub(
              r'[^a-z0-9]+',
              '-',
              source['title'].lower()
          ).strip('-')[:65]

          file = folder / f'{slug}.md'

          file.write_text(
              '# EDITORIAL DRAFT — '
              'NOT FACT-CHECKED OR APPROVED\n\n'
              f'Generated UTC: {now.isoformat()}\n\n'
              f'Primary source publisher: '
              f'{source["publisher"]}\n\n'
              f'Primary source URL: '
              f'{source["url"]}\n\n'
              'This draft is based on a feed excerpt, '
              'not a verified full article.\n'
              'A human must read the full original '
              'source and verify each substantive claim '
              'before publication.\n\n'
              + draft + '\n',
              encoding='utf-8'
          )

          print(
              f'Draft saved for review: {file}'
          )

          PY

      # STEP 8: Create a draft Pull Request

      - name: Create human-review draft PR (never publish)
        uses: peter-evans/create-pull-request@v8

        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          branch: automation/evidence-first-drafts

          draft: always-true

          delete-branch: true

          commit-message: 'Update AI editorial research draft'

          title: 'Review required: evidence-first technology article draft'

          body: |
            This is an AI-generated, unverified editorial
            draft based on an official RSS item.

            Do NOT merge as a way to approve publication.

            Check the full primary source, each factual
            claim, dates, and SEO fields.

            Public HTML publication is a separate step.

          add-paths: |
            .github/drafts/*.md
