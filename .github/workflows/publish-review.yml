name: TrendAnswer - Prepare Publication PR

on:

  workflow_dispatch:

    inputs:

      draft_filename:

        description: 'Exact markdown filename from .github/drafts/'

        required: true

        type: string

      source_reviewed:

        description: 'Type REVIEWED after checking the source and claims'

        required: true

        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Markdown renderer
        run: python -m pip install 'markdown==3.10' 'bleach==6.2.0'

      - name: Generate publication candidate
        env:
          DRAFT_FILENAME: ${{ inputs.draft_filename }}
          REVIEWED: ${{ inputs.source_reviewed }}

        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import html
          import xml.etree.ElementTree as ET

          from pathlib import Path
          from urllib.parse import urlparse

          import markdown
          import bleach

          # STEP 1: REQUIRE HUMAN REVIEW

          if os.getenv('REVIEWED') != 'REVIEWED':
              raise SystemExit(
                  'First verify the original source '
                  'and type REVIEWED to prepare '
                  'a publication PR.'
              )

          filename = os.environ['DRAFT_FILENAME']

          if not re.fullmatch(
              r'[A-Za-z0-9][A-Za-z0-9._-]*\.md',
              filename
          ):
              raise SystemExit(
                  'Invalid draft filename '
                  '(only the filename, not a path).'
              )

          # STEP 2: FETCH AI DRAFT

          subprocess.run(
              [
                  'git',
                  'fetch',
                  '--no-tags',
                  '--depth=1',
                  'origin',
                  'refs/heads/automation/evidence-first-drafts'
              ],
              check=True
          )

          path = '.github/drafts/' + filename

          draft = subprocess.run(
              [
                  'git',
                  'show',
                  'FETCH_HEAD:' + path
              ],
              text=True,
              capture_output=True,
              check=True
          ).stdout

          # STEP 3: EXTRACT SEO METADATA

          fields = {}

          for key in (
              'SEO_TITLE',
              'META_DESCRIPTION',
              'PRIMARY_KEYWORD',
              'READER_QUESTION',
              'SOURCE_URL'
          ):

              m = re.search(
                  r'^' + key + r':\s*(.+)$',
                  draft,
                  re.M
              )

              if not m:
                  raise SystemExit(
                      f'Missing required field: {key}'
                  )

              fields[key] = m.group(1).strip()

          # STEP 4: EXTRACT ARTICLE CONTENT

          m = re.search(
              r'^ARTICLE_DRAFT:\s*\n([\s\S]+)',
              draft,
              re.M
          )

          if not m or len(m.group(1).strip()) < 500:
              raise SystemExit(
                  'Article body absent or too short; '
                  'review required.'
              )

          article = m.group(1).strip()

          # STEP 5: VALIDATE SOURCE DOMAIN

          url = fields['SOURCE_URL']

          parsed = urlparse(url)

          if (
              parsed.scheme != 'https'
              or parsed.hostname not in (
                  'aws.amazon.com',
                  'blog.google',
                  'blogs.microsoft.com'
              )
          ):
              raise SystemExit(
                  'Unexpected source domain. '
                  'Inspect manually.'
              )

          # STEP 6: GENERATE SEO URL

          title = fields['SEO_TITLE'][:100]

          slug = re.sub(
              r'[^a-z0-9]+',
              '-',
              title.lower()
          ).strip('-')[:72]

          if not slug:
              raise SystemExit(
                  'Could not make a slug.'
              )

          page = Path(slug + '.html')

          if page.exists():
              raise SystemExit(
                  'Page filename already exists; '
                  'choose a distinct title after review.'
              )

          # OFFICIAL WEBSITE ADDRESS

          base = (
              'https://nexoralabs1789.github.io/'
              'Trendanswerglobal/'
          )

          canonical = base + page.name

          # STEP 7: CONVERT MARKDOWN TO HTML

          rendered = markdown.markdown(
              article,
              extensions=[
                  'extra',
                  'sane_lists'
              ]
          )

          safe = bleach.clean(
              rendered,

              tags={
                  'h1',
                  'h2',
                  'h3',
                  'h4',
                  'p',
                  'ul',
                  'ol',
                  'li',
                  'strong',
                  'em',
                  'blockquote',
                  'code',
                  'pre',
                  'a',
                  'br'
              },

              attributes={
                  'a': [
                      'href',
                      'title'
                  ]
              },

              protocols={
                  'https',
                  'http'
              },

              strip=True
          )

          esc = lambda value: html.escape(
              value,
              quote=True
          )

          # STEP 8: CREATE SEO HTML PAGE

          page.write_text(
              f'''<!doctype html>

          <html lang="en">

          <head>

          <meta charset="utf-8">

          <meta name="viewport"
                content="width=device-width,initial-scale=1">

          <title>{esc(title)} | TrendAnswer Global</title>

          <meta name="description"
                content="{esc(fields['META_DESCRIPTION'][:160])}">

          <link rel="canonical"
                href="{esc(canonical)}">

          <style>

          body {{
              font-family: system-ui, Arial, sans-serif;
              line-height: 1.7;
              max-width: 820px;
              margin: 40px auto;
              padding: 0 18px;
              color: #17243a;
          }}

          a {{
              color: #1263a1;
          }}

          header {{
              border-bottom: 1px solid #ddd;
              margin-bottom: 30px;
          }}

          </style>

          </head>

          <body>

          <header>

          <a href="./">TrendAnswer Global</a>

          </header>

          <main>

          <h1>{esc(title)}</h1>

          {safe}

          <hr>

          <p>
          <strong>Primary source:</strong>
          <a href="{esc(url)}"
             rel="noopener noreferrer">
             {esc(url)}
          </a>
          </p>

          </main>

          <footer>

          <p>
          TrendAnswer Global —
          independently edited explainer.
          </p>

          </footer>

          </body>

          </html>''',

              encoding='utf-8'
          )

          # STEP 9: UPDATE HOMEPAGE

          homepage = Path('index.html')

          home = homepage.read_text(
              encoding='utf-8'
          )

          link = (
              f'<section class="card">'
              f'<h2>'
              f'<a href="{esc(page.name)}">'
              f'{esc(title)}'
              f'</a>'
              f'</h2>'
              f'<p>'
              f'{esc(fields["META_DESCRIPTION"][:160])}'
              f'</p>'
              f'</section>'
          )

          if '</main>' not in home.lower():
              raise SystemExit(
                  'Homepage lacks </main>; '
                  'edit template before publishing.'
              )

          home = re.sub(
              r'</main>',
              lambda _: link + '\n</main>',
              home,
              count=1,
              flags=re.I
          )

          homepage.write_text(
              home,
              encoding='utf-8'
          )

          # STEP 10: UPDATE SITEMAP

          sitemap = Path('sitemap.xml')

          ns = (
              'http://www.sitemaps.org/'
              'schemas/sitemap/0.9'
          )

          ET.register_namespace('', ns)

          if sitemap.exists():

              root = ET.parse(
                  sitemap
              ).getroot()

          else:

              root = ET.Element(
                  '{' + ns + '}urlset'
              )

              ET.SubElement(
                  ET.SubElement(
                      root,
                      '{' + ns + '}url'
                  ),
                  '{' + ns + '}loc'
              ).text = base

          existing = {
              elem.text
              for elem in root.findall(
                  './/{' + ns + '}loc'
              )
          }

          if canonical not in existing:

              ET.SubElement(
                  ET.SubElement(
                      root,
                      '{' + ns + '}url'
                  ),
                  '{' + ns + '}loc'
              ).text = canonical

          ET.ElementTree(
              root
          ).write(
              sitemap,
              encoding='utf-8',
              xml_declaration=True
          )

          print(
              'Prepared:',
              page,
              'homepage and sitemap '
              'for a publication PR. NOT LIVE.'
          )

          PY

      # STEP 11: CREATE PUBLICATION APPROVAL PR

      - name: Open publication approval PR (not live until merged)
        uses: peter-evans/create-pull-request@v8

        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          branch: automation/publication-candidate

          delete-branch: true

          title: 'Ready for final approval - TrendAnswer article'

          body: |
            This PR changes the PUBLIC website
            (HTML, homepage and sitemap).

            Check every source and factual claim,
            inspect the HTML preview,
            then merge ONLY if approved.

            Merging to main will publish
            on GitHub Pages.

          add-paths: |
            *.html
            index.html
            sitemap.xml
