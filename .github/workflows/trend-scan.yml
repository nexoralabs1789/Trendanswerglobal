name: TrendAnswer Global - Daily Trend Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect global technology news
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import datetime
          import os
          import re

          topics = [
              "artificial intelligence",
              "technology",
              "cybersecurity",
              "software updates"
          ]

          results = []
          seen = set()

          for topic in topics:
              query = urllib.parse.quote(topic + " when:2d")
              url = (
                  "https://news.google.com/rss/search?q="
                  + query
                  + "&hl=en-US&gl=US&ceid=US:en"
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as response:
                      data = response.read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item")[:12]:
                      title = item.findtext("title", "")
                      link = item.findtext("link", "")
                      published = item.findtext("pubDate", "")

                      if not title or title.lower() in seen:
                          continue

                      seen.add(title.lower())

                      subject = re.sub(
                          r"\s+-\s+[^-]+$", "", title
                      ).strip()

                      questions = [
                          f"What happened with {subject}?",
                          f"Why is {subject} important?",
                          f"What should users know about {subject}?"
                      ]

                      results.append({
                          "topic": topic,
                          "title": title,
                          "link": link,
                          "published": published,
                          "questions": questions
                      })

              except Exception as error:
                  print(f"Feed error for {topic}: {error}")

          os.makedirs("reports", exist_ok=True)

          today = datetime.datetime.now(
              datetime.timezone.utc
          ).strftime("%Y-%m-%d")

          path = f"reports/trends-{today}.md"

          with open(path, "w", encoding="utf-8") as f:
              f.write("# TrendAnswer Global\n\n")
              f.write(f"Trend Research Report: {today}\n\n")
              f.write(f"Stories collected: {len(results)}\n\n")
              f.write(
                  "Editorial note: Headlines are unverified "
                  "research leads, not publishable facts.\n\n"
              )

              for i, result in enumerate(results, 1):
                  f.write(f"## {i}. {result['title']}\n\n")
                  f.write(f"Category: {result['topic']}\n\n")
                  f.write(f"Published: {result['published']}\n\n")
                  f.write(f"Source: {result['link']}\n\n")
                  f.write("### Suggested questions\n\n")

                  for question in result["questions"]:
                      f.write(f"- {question}\n")

                  f.write("\n---\n\n")

          if not results:
              raise RuntimeError(
                  "No stories collected. Check RSS feeds."
              )

          print(f"Saved {len(results)} stories to {path}")
          PY

      - name: Save research report
        uses: actions/upload-artifact@v4
        with:
          name: trendanswer-daily-report
          path: reports/
          retention-days: 14
